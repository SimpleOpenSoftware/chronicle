apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The data PVC is ReadWriteOnce and the node has little spare memory, so stop
  # the old pod before starting the new one instead of running both at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.persistence.enabled }}
      # Copy the repo config into the writable config dir. Settings already
      # there (saved from the app) win; only keys new in the repo are added.
      # See backend/src/backend/config_seed.py.
      initContainers:
        - name: config-seed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - backend.config_seed
            - /seed
            - {{ printf "%s/config" .Values.persistence.mountPath | quote }}
          volumeMounts:
            - name: config-files
              mountPath: /seed
              readOnly: true
            - name: data-volume
              mountPath: {{ .Values.persistence.mountPath }}
      {{- end }}
      containers:
        # Main FastAPI backend
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.workers.sidecar.enabled }}
          # The sidecar owns the workers. start-k8s.sh would start a second fleet,
          # and both fleets would transcribe every session.
          command: ["python3", "-u", "src/backend/main.py"]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: chronicle-config
            - secretRef:
                name: chronicle-secrets
          env:
            # Override specific values from Kubernetes/Helm if needed
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.persistence.enabled }}
            # Writable config on the data volume, like the Docker bind mount.
            # The config-seed init container fills it from the ConfigMap.
            - name: CONFIG_DIR
              value: {{ printf "%s/config" .Values.persistence.mountPath | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 120
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 120
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if not .Values.persistence.enabled }}
            - name: config-files
              mountPath: /app/config
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: {{ .Values.persistence.mountPath }}
            - name: data-volume
              mountPath: /app/audio_chunks
            {{- end }}

        {{- if .Values.workers.sidecar.enabled }}
        # Workers sidecar container (optional)
        - name: {{ .Chart.Name }}-workers
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uv", "run", "python", "worker_orchestrator.py"]
          envFrom:
            - configMapRef:
                name: chronicle-config
            - secretRef:
                name: chronicle-secrets
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.persistence.enabled }}
            # Writable config on the data volume, like the Docker bind mount.
            # The config-seed init container fills it from the ConfigMap.
            - name: CONFIG_DIR
              value: {{ printf "%s/config" .Values.persistence.mountPath | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.workers.resources | default .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if not .Values.persistence.enabled }}
            - name: config-files
              mountPath: /app/config
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: {{ .Values.persistence.mountPath }}
            - name: data-volume
              mountPath: /app/audio_chunks
            {{- end }}
        {{- end }}
      volumes:
        - name: config-files
          configMap:
            name: chronicle-config
            {{- if not .Values.persistence.enabled }}
            items:
              - key: defaults.yml
                path: defaults.yml
              - key: config.yml
                path: config.yml
            {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "backend.fullname" . }}-data
        {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
