[project]
name = "chronicle-screenpipe-collector"
version = "0.1.0"
description = "Chronicle companion for a local ScreenPipe recorder"
requires-python = ">=3.11,<3.14"
dependencies = ["httpx>=0.28,<1", "rich>=13,<15", "transformers>=4.56,<5", "timm>=1.0,<2", "pillow>=11,<13"]

[dependency-groups]
cpu = ["torch==2.8.0", "torchvision==0.23.0"]
cuda = ["torch==2.8.0", "torchvision==0.23.0"]

[tool.uv]
default-groups = ["cpu"]
conflicts = [[{ group = "cpu" }, { group = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", group = "cuda", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", group = "cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
chronicle-screenpipe = "chronicle_screenpipe.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
